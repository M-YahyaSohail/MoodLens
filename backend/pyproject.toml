[project]
name = "backend"
version = "0.1.0"
description = "Moodlens - multimodal emotion & sentiment analysis AI"
readme = "README.md"
authors = [
    { name = "TaherMustansir1929", email = "eren.jeager1929101@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "huggingface-hub>=2.4.0",
    "numpy>=2.1.0",
    "openai-whisper>=20250625",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.110",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RUF", # ruff-specific rules
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",   # line too long (formatter keeps lines short)
    "B008",   # function calls in default arguments (argparse defaults)
    "B904",   # exception chaining style (kept explicit for readability)
    "FBT001", # boolean positional argument in function definition
    "FBT002", # boolean default value in function definition
    "TCH003", # move import out of type-checking block (n/a here)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]

[tool.ty]
